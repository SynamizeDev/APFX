<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title"><title id="title">Trading Academy</title>
<defs>
 <linearGradient id="pearl" x1="0" y1="0" x2=".85" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ffffff"/><stop offset=".42" stop-color="#f6faf7"/><stop offset="1" stop-color="#abbeb0"/></linearGradient>
 <linearGradient id="paper" x2=".2" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dce7df"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#acff94"/><stop offset=".4" stop-color="#02e402"/><stop offset="1" stop-color="#009a23"/></linearGradient>
 <linearGradient id="edge" x2=".3" y2="1"><stop stop-color="#00b924"/><stop offset="1" stop-color="#005e21"/></linearGradient>
 <linearGradient id="dark" x2=".8" y2="1"><stop stop-color="#53675e"/><stop offset=".45" stop-color="#233a30"/><stop offset="1" stop-color="#10261b"/></linearGradient>
 <radialGradient id="glass" cx=".32" cy=".25" r=".8"><stop stop-color="#6c9c7b"/><stop offset=".4" stop-color="#253e30"/><stop offset="1" stop-color="#071b10"/></radialGradient>
 <radialGradient id="shadow"><stop stop-color="#1d532d" stop-opacity=".18"/><stop offset="1" stop-color="#1d532d" stop-opacity="0"/></radialGradient>
</defs>
<style>
.float{animation:float 5s ease-in-out infinite;transform-origin:160px 160px}
.signal{animation:signal 3s ease-out infinite;transform-origin:239px 87px}
.signal2{animation-delay:.45s}
.chart{stroke-dasharray:150;stroke-dashoffset:0;animation:draw 5s ease-in-out infinite}
.tassel{animation:swing 5s ease-in-out infinite;transform-origin:226px 119px}
.dot{animation:pulse 2.8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}
@keyframes draw{0%,15%{stroke-dashoffset:150}60%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:150}}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes signal{0%{opacity:0;transform:scale(.94)}35%{opacity:.8}100%{opacity:0;transform:scale(1.07)}}
@media(prefers-reduced-motion:reduce){.float,.signal,.chart,.tassel,.dot{animation:none}}
</style>
<ellipse cx="160" cy="263" rx="112" ry="19" fill="url(#shadow)"/>
<g class="float">
<!-- Sculpted cover and stacked page block -->
