<path d="M45 111Q102 95 156 123Q208 92 273 111L270 218Q211 201 156 233Q101 205 45 223Z" fill="url(#green)" stroke="#089d2a" stroke-width="1.5"/>
<path d="M54 103Q107 91 156 121L156 220Q111 195 54 213Z" fill="url(#pearl)"/>
<path d="M156 121Q207 88 263 102L263 208Q207 196 156 220Z" fill="url(#pearl)"/>
<path d="M57 96Q110 88 155 116L155 211Q110 189 57 202Z" fill="url(#paper)" stroke="#fff" stroke-width="2"/>
<path d="M158 116Q205 85 259 95L259 198Q203 189 158 211Z" fill="url(#paper)" stroke="#fff" stroke-width="2"/>
<path d="M156 120V216" stroke="#95aa9a" stroke-width="2"/>
<path d="M70 174Q107 169 139 185M70 184Q107 178 130 191M179 171Q213 156 245 161M179 184Q214 170 244 175" fill="none" stroke="#a5b8aa" stroke-width="4" stroke-linecap="round"/>
<path d="M183 102V137L197 126L208 129V91" fill="url(#green)"/>
<path d="M77 150L77 136M93 158V126M110 156V132M128 159V122" stroke="#254837" stroke-width="8" stroke-linecap="round"/>
<path class="chart" d="M72 157L89 145L104 151L122 130L139 124" stroke="#02df13" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M55 210Q108 196 146 217M166 219Q211 197 261 207" stroke="#fff" stroke-opacity=".8" fill="none"/>
</g></svg>